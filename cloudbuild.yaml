steps:
  # Install and build Cloud Functions
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd functions
        npm ci
        npm run build

  # Deploy functions, Firestore rules, Firestore indexes, and Storage rules to Firebase
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only functions,firestore:rules,firestore:indexes,storage --project $PROJECT_ID --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
